[project]
name = "coalcast"
version = "0.1.0"
description = "Nowcasting Mongolia's monthly coal exports from free satellite data"
requires-python = ">=3.10"
dependencies = [
  "numpy", "pandas", "scipy", "scikit-learn", "lightgbm", "matplotlib",
  "pystac-client", "planetary-computer", "odc-stac", "xarray", "pyproj",
]

[project.optional-dependencies]
dev = ["pytest"]

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
